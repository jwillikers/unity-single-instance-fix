name: Build

"on":
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    paths:
      - '**.c'
      - 'meson.build'
      - .github/workflows/build.yaml
      - 'flake.lock'
    tags: ["*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    permissions:
      contents: write
      pull-requests: read
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            arch: x86
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      # Always run this job so that required status checks report on every PR,
      # but only do the work when relevant files changed.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            relevant:
              - '**.c'
              - 'meson.build'
              - .github/workflows/build.yaml
              - 'flake.lock'
      - name: Determine whether to run
        id: gate
        run: echo "run=${{ github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
      - uses: DeterminateSystems/nix-installer-action@v23
        if: steps.gate.outputs.run == 'true'
      - name: Install GCC multilib
        if: steps.gate.outputs.run == 'true' && (matrix.platform.arch == 'x86')
        run: |
          sudo apt update
          sudo apt-get install gcc-multilib
      - name: Meson Setup
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ ${{ matrix.platform.arch }} = "x86" ]; then
            nix develop --command meson setup build --buildtype debugoptimized --cross-file meson-cross-x86-linux-gnu
          else
            nix develop --command meson setup build --buildtype debugoptimized
          fi
      - name: Meson Compile
        if: steps.gate.outputs.run == 'true'
        run: nix develop --command meson compile -C build
      - name: Rename shared library according to architecture
        if: steps.gate.outputs.run == 'true'
        run: mv build/libunity-single-instance-fix.so libunity-single-instance-fix-${{ matrix.platform.arch }}.so
      - uses: actions/upload-artifact@v7
        if: steps.gate.outputs.run == 'true'
        with:
          name: libunity-single-instance-fix-${{ matrix.platform.arch }}.so
          path: libunity-single-instance-fix-${{ matrix.platform.arch }}.so
      - name: Upload release artifacts
        if: steps.gate.outputs.run == 'true' && (github.ref_type == 'tag')
        uses: softprops/action-gh-release@v3
        with:
          files: libunity-single-instance-fix-${{ matrix.platform.arch }}.so
